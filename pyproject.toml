[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-silence"
version = "2.0.0"
description = "Evaluating Claim-Space Density for Evidence Insufficiency Under Construction and Reference-Manifold Shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thrilok Manjunath", email = "thrilokmanjunath@gmail.com" },
    { name = "Piush Kole" }
]
keywords = [
    "fact-verification",
    "hallucination-detection",
    "uncertainty-quantification",
    "out-of-distribution",
    "information-voids",
    "fever",
    "averitec"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "numpy>=1.24",
    "httpx>=0.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
paper = [
    "python-docx>=1.1.0",
    "matplotlib>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "paper"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
]
