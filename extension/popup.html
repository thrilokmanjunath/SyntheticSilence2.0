<!DOCTYPE html>
<html lang="en" class="is-popup">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SyntheticSilence2.0</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Synthetic Silence</h1>
      <p id="status" class="status" data-state="checking" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Checking backend</span>
      </p>
      <button type="button" id="historyBtn" class="icon-btn" title="History" aria-label="History">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="10" cy="10" r="7"/>
          <path d="M10 6v4l2.5 1.5"/>
        </svg>
      </button>
      <button type="button" id="panelBtn" class="icon-btn" title="Open in side panel" aria-label="Open in side panel">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="3.5" width="15" height="13" rx="2"/>
          <path d="M12.5 3.5v13"/>
        </svg>
      </button>
    </header>

    <main class="layout">
      <section class="compose" aria-labelledby="composeLabel">
        <label id="composeLabel" for="inputText">Text to check</label>
        <textarea id="inputText" rows="5" spellcheck="true"
          placeholder="Paste a paragraph, or select text on the page and use it here."></textarea>
        <div class="compose-foot">
          <span id="count" class="count">0 / 4,000</span>
          <button type="button" id="grabBtn" class="btn ghost">Use page selection</button>
          <button type="button" id="analyzeBtn" class="btn primary" disabled>Check evidence</button>
        </div>
        <p class="hint">Ctrl+Enter or Cmd+Enter also runs the check.</p>

        <details class="settings">
          <summary>Settings</summary>
          <label class="check">
            <input type="checkbox" id="researchMode">
            <span>Research mode: show density and entropy signals</span>
          </label>
          <label class="field">
            <span>Theme</span>
            <select id="theme">
              <option value="system">Match system</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <div class="settings-row">
            <label class="sr-only" for="backendUrl">Backend address</label>
            <input id="backendUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false">
            <button type="button" id="saveBackend" class="btn ghost">Save</button>
          </div>
          <p id="backendMsg" class="hint" role="status"></p>
          <p id="backendInfo" class="hint"></p>
          <p class="hint">Claim text is sent to OpenRouter for analysis. Search terms go to Wikipedia and OpenAlex.</p>
        </details>
      </section>

      <section id="output" class="output" aria-live="polite"></section>
    </main>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
